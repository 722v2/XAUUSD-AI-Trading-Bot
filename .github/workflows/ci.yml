name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build and test
        run: npm test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python bridge dependencies
        run: |
          python -m pip install -r mt5_bridge/requirements.txt
          python -m pip install -r mt5_bridge_v2/requirements.txt
      # Bridge V2 must remain importable without a Windows MT5 terminal on CI.
      - name: Compile rebuilt bridge modules
        run: python -m compileall -q mt5_bridge_v2
      - name: Validate Bridge V2 imports
        run: python -c "from mt5_bridge_v2.agent.main import Agent; from mt5_bridge_v2.agent.order_executor import OrderExecutor; print('Bridge V2 imports OK')"
      - name: Test MT5 bridge and relay safety contracts
        run: python -m unittest discover -s tests_python -v
